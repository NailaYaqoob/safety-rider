<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Safety Rider — Live Heat Operations</title>
<link rel="stylesheet" href="/dashboard/static/vendor/leaflet.css" />
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #272e38;
    --text: #e6edf3; --muted: #8b949e;
    --safe: #2ea043; --warning: #d29922; --danger: #f85149; --unknown: #6e7681;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #map { flex: 1; height: 100vh; background: #0b0f14; }

  aside {
    width: 400px; flex-shrink: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .2px; }
  header p  { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .status-row { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .chip {
    flex: 1; text-align: center; padding: 6px 4px; border-radius: 6px;
    background: #0d1117; border: 1px solid var(--line); font-size: 12px;
  }
  .chip b { display: block; font-size: 18px; line-height: 1.2; }
  .chip.safe b { color: var(--safe); } .chip.warning b { color: var(--warning); }
  .chip.danger b { color: var(--danger); }

  .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  button {
    flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--line);
    background: #21262d; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: #7d2018; border-color: #a13226; }
  button.primary:hover:not(:disabled) { background: #a13226; }

  /* Trend chart. Fixed height so the feed below it keeps the space it had. */
  .trend { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); position: relative; }
  .trend h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .3px;
    text-transform: uppercase; color: var(--muted);
  }
  .trend svg { display: block; width: 100%; height: 128px; overflow: visible; }
  .trend .axis  { stroke: var(--line); stroke-width: 1; }
  .trend .rule  { stroke: #3a424d; stroke-width: 1; }
  .trend text   { fill: var(--muted); font-size: 9px; }
  .trend .value { fill: var(--text); font-size: 11px; font-weight: 600; }
  .trend .hit   { fill: transparent; cursor: crosshair; }
  .trend .cursor { stroke: #4a5462; stroke-width: 1; opacity: 0; }
  .trend .caption { margin: 4px 0 0; font-size: 10px; color: var(--muted); }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: #0d1117; border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 8px; font-size: 11px; line-height: 1.4; white-space: nowrap; z-index: 5;
  }
  #tip b { color: var(--text); }

  #feed { flex: 1; overflow-y: auto; padding: 8px 0; }
  .event {
    padding: 9px 16px; border-left: 3px solid var(--unknown);
    border-bottom: 1px solid #1c222b; font-size: 13px;
  }
  .event.safe { border-left-color: var(--safe); }
  .event.warning { border-left-color: var(--warning); }
  .event.danger { border-left-color: var(--danger); background: rgba(248,81,73,.07); }
  .event time { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; text-align: center; }

  footer { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  #conn::before { content: "●"; margin-right: 5px; color: var(--danger); }
  #conn.live::before { color: var(--safe); }

  /* Rider markers. Danger blinks — motion is what pulls the eye to the one
     rider who needs help on a map with dozens of dots. */
  .rider { border-radius: 50%; border: 2px solid rgba(255,255,255,.85); }
  .rider.safe    { background: var(--safe); }
  .rider.warning { background: var(--warning); }
  .rider.unknown { background: var(--unknown); }
  .rider.danger  { background: var(--danger); animation: blink 1s ease-in-out infinite; }
  @keyframes blink {
    0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(248,81,73,.75); }
    50%     { opacity: .55; box-shadow: 0 0 0 12px rgba(248,81,73,0); }
  }
  /* Respect users who get sick from motion; colour still distinguishes it. */
  @media (prefers-reduced-motion: reduce) { .rider.danger { animation: none; } }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #161b22; color: var(--text); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
</style>
</head>
<body>
  <div id="map"></div>

  <aside>
    <header>
      <h1>🌡️ Safety Rider — Live Operations</h1>
      <p id="subtitle">Connecting…</p>
    </header>

    <div class="status-row">
      <div class="chip safe">   <b id="n-safe">0</b>Safe</div>
      <div class="chip warning"><b id="n-warning">0</b>Warning</div>
      <div class="chip danger"> <b id="n-danger">0</b>Danger</div>
    </div>

    <section class="trend">
      <h2>Peak temperature — last 24 readings</h2>
      <svg id="trend" role="img" aria-label="Peak temperature per reading against the high-heat and danger thresholds"></svg>
      <p class="caption" id="trend-caption">Waiting for the first reading.</p>
      <div id="tip"></div>
    </section>

    <div class="controls">
      <button class="primary" id="btn-spike">⚡ Simulate Heat Spike</button>
      <button id="btn-reset">Reset</button>
    </div>

    <div id="feed"><div class="empty">No events yet. Send a location pin, or hit Simulate Heat Spike.</div></div>

    <footer><span id="conn">disconnected</span> · <span id="mode">—</span></footer>
  </aside>

<script src="/dashboard/static/vendor/leaflet.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────────────────
   Safety Rider dashboard.
   Three jobs: draw riders on a map, stream the alert feed, fire the demo spike.
   No framework and no build step — it is served straight off FastAPI.
   ──────────────────────────────────────────────────────────────────────────── */

const API = {
  state:    "/api/dashboard/state",
  stream:   "/api/dashboard/stream",
  simulate: "/api/dashboard/simulate",
  reset:    "/api/dashboard/reset",
};

const markers = {};        // rider_id -> Leaflet marker
let map, devTools = true;

/* ── map ─────────────────────────────────────────────────────────────────── */

function initMap(center) {
  map = L.map("map", { zoomControl: true }).setView([center.lat, center.lon], 13);
  // CARTO dark tiles: the only external request this page makes. If it is
  // blocked the map stays dark grey and every marker still works.
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: "abcd", maxZoom: 19,
  }).addTo(map);
}

function riderIcon(status) {
  const size = status === "danger" ? 20 : 14;
  return L.divIcon({
    className: "",
    html: `<div class="rider ${status}" style="width:${size}px;height:${size}px"></div>`,
    iconSize: [size, size], iconAnchor: [size / 2, size / 2],
  });
}

function popupFor(r) {
  const temp = r.temperature_c == null ? "—" : `${r.temperature_c.toFixed(1)} °C`;
  const hrs  = r.hours_above_threshold == null ? "" :
               `<br>~${r.hours_above_threshold.toFixed(0)} h/day above the high-heat line`;
  const src  = r.source === "live" ? "measured" : r.source.toUpperCase();
  return `<b>${r.rider_id}</b>${r.label ? " · " + r.label : ""}<br>
          Status: <b>${r.status.toUpperCase()}</b><br>Peak: ${temp}${hrs}
          <br><small>${src}${r.observed_date ? " · " + r.observed_date : ""}</small>`;
}

function upsertRider(r) {
  const pos = [r.latitude, r.longitude];
  if (markers[r.rider_id]) {
    markers[r.rider_id].setLatLng(pos).setIcon(riderIcon(r.status)).setPopupContent(popupFor(r));
  } else {
    markers[r.rider_id] = L.marker(pos, { icon: riderIcon(r.status) })
      .addTo(map).bindPopup(popupFor(r));
  }
  markers[r.rider_id]._status = r.status;
  recount();
}

// The configured centre is only a fallback. A rider pinning from outside it —
// anywhere out of the default metro — used to leave a marker thousands of km
// off-screen while the map sat on an empty default view, which reads exactly
// like a dashboard that is not working.
function frameRiders() {
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 13);
  else map.fitBounds(L.latLngBounds(pts).pad(0.25));
  updateSubtitle();
}

function recount() {
  const tally = { safe: 0, warning: 0, danger: 0 };
  Object.values(markers).forEach(m => { if (tally[m._status] !== undefined) tally[m._status]++; });
  document.getElementById("n-safe").textContent    = tally.safe;
  document.getElementById("n-warning").textContent = tally.warning;
  document.getElementById("n-danger").textContent  = tally.danger;
  updateSubtitle();
}

// The subtitle used to be written once at boot, so a rider arriving over SSE
// left it reading "0 rider(s) tracked" next to a map full of markers. It also
// quoted the configured centre, which frameRiders() has usually moved off.
// Both halves are read from live state instead.
function updateSubtitle() {
  const n = Object.keys(markers).length;
  const c = map && map.getCenter();
  document.getElementById("subtitle").textContent =
    `${n} rider(s) tracked` +
    (c ? ` \u00b7 map centred on ${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}` : "");
}

/* ── feed ────────────────────────────────────────────────────────────────── */

const feed = document.getElementById("feed");

function addEvent(e, { prepend = true } = {}) {
  feed.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `event ${e.status || "info"}`;
  const when = e.at ? new Date(e.at) : new Date();
  el.innerHTML = `<time>${when.toLocaleTimeString()}</time>${escapeHtml(e.text)}`;
  prepend ? feed.prepend(el) : feed.append(el);
  while (feed.children.length > 200) feed.lastChild.remove();
}

// Feed text contains rider-supplied values; never inject it as markup.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ── live stream ─────────────────────────────────────────────────────────── */

function connect() {
  const src = new EventSource(API.stream);
  const conn = document.getElementById("conn");

  src.onopen = () => { conn.className = "live"; conn.textContent = "live"; };
  src.onerror = () => { conn.className = ""; conn.textContent = "reconnecting…"; };
  src.onmessage = ev => {
    const e = JSON.parse(ev.data);
    addEvent(e);
    pushReading(e);
    if (e.latitude != null && e.rider_id) {
      upsertRider({
        rider_id: e.rider_id, latitude: e.latitude, longitude: e.longitude,
        status: e.status, temperature_c: e.temperature_c,
        hours_above_threshold: null, label: null, source: "unknown", observed_date: null,
      });
      // Follow danger anywhere; follow anything at all if this is the first
      // rider on the map, so the view is never left staring at empty ocean.
      if (e.status === "danger" || Object.keys(markers).length === 1)
        map.panTo([e.latitude, e.longitude]);
    }
  };
  // EventSource retries on its own; no manual reconnect loop needed.
}

/* ── trend chart ─────────────────────────────────────────────────────────── */
/* One measure (peak °C) against two fixed thresholds, so the form is a line
   read against a baseline rather than bars — a bar chart of temperature would
   need a zero baseline, which would flatten the 25–42 °C range that matters. */

const READINGS_MAX = 24;
const readings = [];                       // { at, c, status, rider }
let thresholds = { high_heat_c: 32.2, danger_c: 39.4 };   // replaced by /state

// Read once from the stylesheet rather than duplicated as hex here: the chips,
// the map markers and these dots must never drift apart. Resolved to concrete
// values because var() in an SVG presentation attribute is not portable — it
// renders black in several SVG engines, which would silently turn every band
// the same colour.
const ink = name =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const BAND = { safe: ink("--safe"), warning: ink("--warning"),
               danger: ink("--danger"), unknown: ink("--unknown") };
const SURFACE = ink("--panel");

function pushReading(e, { draw = true } = {}) {
  // Only evaluations carry a temperature; system lines and failed reads do not.
  if (e.temperature_c == null || !isFinite(e.temperature_c)) return;
  readings.push({
    at: e.at ? new Date(e.at) : new Date(),
    c: e.temperature_c,
    status: e.status || "unknown",
    rider: e.rider_id || "—",
  });
  while (readings.length > READINGS_MAX) readings.shift();
  // Backfill passes a whole history in a loop and draws once at the end.
  if (draw) drawTrend();
}

const svg = document.getElementById("trend");
const tip = document.getElementById("tip");
const caption = document.getElementById("trend-caption");

function svgEl(name, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text != null) el.textContent = text;   // textContent, never innerHTML
  return el;
}

function drawTrend() {
  svg.replaceChildren();
  const W = svg.clientWidth || 368, H = 128;
  const L = 30, R = 10, T = 8, B = 16;              // plot margins
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B;

  if (!readings.length) {
    svg.append(svgEl("text", { x: W / 2, y: H / 2, "text-anchor": "middle" },
                     "No readings yet"));
    caption.textContent = "Waiting for the first reading.";
    return;
  }

  // Domain always spans both thresholds, so the reference lines are on screen
  // even when every rider is cool — "how far below danger" is the whole point.
  const temps = readings.map(r => r.c);
  const lo = Math.floor(Math.min(...temps, thresholds.high_heat_c) - 2);
  const hi = Math.ceil(Math.max(...temps, thresholds.danger_c) + 2);
  const y = c => y1 - ((c - lo) / (hi - lo)) * (y1 - y0);
  const n = readings.length;
  const x = i => n === 1 ? (x0 + x1) / 2 : x0 + (i / (n - 1)) * (x1 - x0);

  // Band washes: the zones the thresholds cut the scale into, at ~10%.
  const zones = [
    [lo, thresholds.high_heat_c, BAND.safe],
    [thresholds.high_heat_c, thresholds.danger_c, BAND.warning],
    [thresholds.danger_c, hi, BAND.danger],
  ];
  for (const [a, b, fill] of zones) {
    const top = y(Math.min(b, hi)), bottom = y(Math.max(a, lo));
    if (bottom - top > 0.5)
      svg.append(svgEl("rect", { x: x0, y: top, width: x1 - x0,
                                 height: bottom - top, fill, opacity: 0.14 }));
  }

  // Threshold rules, labelled — status is never carried by colour alone.
  // Labels sit at the left because the right edge belongs to the endpoint
  // value; two right-aligned labels collide the moment the latest reading is
  // near a threshold, which is exactly when it is being read.
  const LABEL_ZONE = x0 + 95;                       // where the labels lie
  const nearYs = readings.map((r, i) => [x(i), y(r.c)])
                         .filter(([px]) => px <= LABEL_ZONE)
                         .map(([, py]) => py);
  for (const [c, label] of [[thresholds.high_heat_c, "high heat"],
                            [thresholds.danger_c, "danger"]]) {
    const yc = y(c);
    svg.append(svgEl("line", { class: "rule", x1: x0, x2: x1, y1: yc, y2: yc }));
    // Sit on whichever side of the rule the trace is not using. Above by
    // default, and when nothing is nearby.
    const traceAbove = nearYs.some(py => py < yc);
    const traceBelow = nearYs.some(py => py > yc);
    const ly = traceAbove && !traceBelow ? yc + 12 : yc - 4;
    svg.append(svgEl("text", { x: x0 + 4, y: ly }, `${label} ${c.toFixed(1)}°`));
  }

  // Y axis: just the two ends, rounded. The rules carry the middle.
  svg.append(svgEl("line", { class: "axis", x1: x0, x2: x0, y1: y0, y2: y1 }));
  for (const c of [lo, hi])
    svg.append(svgEl("text", { x: x0 - 5, y: y(c) + 3, "text-anchor": "end" },
                     `${c}°`));

  // The line: neutral ink, because identity here belongs to the dots.
  if (n > 1) {
    svg.append(svgEl("polyline", {
      class: "series", fill: "none", stroke: "#6b7684", "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
      points: readings.map((r, i) => `${x(i)},${y(r.c)}`).join(" "),
    }));
  }

  const cursor = svgEl("line", { class: "cursor", y1: y0, y2: y1, x1: 0, x2: 0 });
  svg.append(cursor);

  // Dots: 9px, filled by band, with a 2px surface ring so they stay legible
  // where the line crosses them.
  readings.forEach((r, i) => {
    svg.append(svgEl("circle", {
      cx: x(i), cy: y(r.c), r: 4.5, fill: BAND[r.status] || BAND.unknown,
      stroke: SURFACE, "stroke-width": 2,
    }));
  });

  // Label the endpoint only — a number on every dot is unreadable at 368px.
  const last = readings[n - 1];
  const lastX = x(n - 1), lastY = y(last.c);
  // Place it on the free side. The incoming segment occupies the space above
  // the endpoint when the trace is rising and below it when falling, so
  // following the slope keeps the label off the line without any nudging.
  const rising = n > 1 && last.c >= readings[n - 2].c;
  const labelY = rising ? Math.max(lastY - 10, y0 + 10)
                        : Math.min(lastY + 17, y1 - 2);
  svg.append(svgEl("text", {
    class: "value", x: Math.min(lastX + 8, x1), y: labelY,
    "text-anchor": lastX > x1 - 40 ? "end" : "start",
  }, `${last.c.toFixed(1)} °C`));

  // Hit slots, wider than the dots, one per reading.
  const slot = (x1 - x0) / Math.max(n - 1, 1);
  readings.forEach((r, i) => {
    const hit = svgEl("rect", {
      class: "hit", x: x(i) - slot / 2, y: y0, width: slot, height: y1 - y0,
    });
    hit.addEventListener("mouseenter", () => {
      cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i));
      cursor.style.opacity = 1;
      tip.textContent = "";
      tip.append(
        Object.assign(document.createElement("b"), { textContent: `${r.c.toFixed(1)} °C` }),
        document.createTextNode(` · ${r.status}`),
        document.createElement("br"),
        document.createTextNode(`${r.rider} · ${r.at.toLocaleTimeString()}`),
      );
      tip.style.opacity = 1;
      tip.style.left = Math.max(4, Math.min(x(i) + 4, svg.clientWidth - 130)) + "px";
      tip.style.top = (y(r.c) + 34) + "px";
    });
    hit.addEventListener("mouseleave", () => {
      tip.style.opacity = 0; cursor.style.opacity = 0;
    });
    svg.append(hit);
  });

  const clock = d => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const span = n === 1 ? clock(last.at) : `${clock(readings[0].at)} → ${clock(last.at)}`;
  // Evaluations arrive irregularly, so the x axis is arrival order, not a time
  // scale. Saying so costs a few words and stops the gaps being misread.
  caption.textContent =
    `${n} reading${n > 1 ? "s" : ""} · ${span} · spaced evenly, not by time`;
}

// The panel is a fixed 400px today, but a resized window still redraws.
addEventListener("resize", drawTrend);

/* ── controls ────────────────────────────────────────────────────────────── */

document.getElementById("btn-spike").onclick = async (ev) => {
  const btn = ev.currentTarget;
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const res = await fetch(API.simulate, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ temperature_c: 41.5, rider_label: "Demo rider" }),
    });
    const data = await res.json();
    if (data.error) addEvent({ text: `Simulate: ${data.error}`, status: "unknown" });
    else addEvent({ text: `Simulated ${data.temperature_c} °C — WhatsApp ${data.whatsapp_sent ? "sent ✅" : "not sent"}`, status: data.status });
  } catch (err) {
    addEvent({ text: `Simulate failed: ${err}`, status: "unknown" });
  } finally {
    btn.disabled = false; btn.textContent = "⚡ Simulate Heat Spike";
  }
};

document.getElementById("btn-reset").onclick = async () => {
  await fetch(API.reset, { method: "POST" });
  Object.values(markers).forEach(m => map.removeLayer(m));
  for (const k in markers) delete markers[k];
  feed.innerHTML = '<div class="empty">Reset. Waiting for events…</div>';
  readings.length = 0;
  drawTrend();
  recount();
};

/* ── boot ────────────────────────────────────────────────────────────────── */

(async function start() {
  const s = await (await fetch(API.state)).json();
  devTools = s.dev_tools;
  if (s.thresholds) thresholds = s.thresholds;
  initMap(s.center);
  s.riders.forEach(upsertRider);
  frameRiders();
  // history() is oldest-first, which is the order the chart wants; the feed
  // appends in the same pass so both read from one traversal.
  s.events.forEach(e => {
    addEvent(e, { prepend: false });
    pushReading(e, { draw: false });
  });
  drawTrend();

  updateSubtitle();
  document.getElementById("mode").textContent =
    (s.mock_mode ? "SIMULATED temperatures" : "live FortyGuard data") +
    (s.demo_number_configured ? "" : " · no demo number set");

  const spike = document.getElementById("btn-spike");
  if (!devTools) { spike.disabled = true; spike.textContent = "Dev tools disabled"; }

  connect();
})();
</script>
</body>
</html>
